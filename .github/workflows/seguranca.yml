name: Segurança

# Segredos no histórico (gitleaks) e análise estática (CodeQL + Semgrep). Grátis em repositório
# público.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SEGUNDA OPINIÃO SOBRE SEGREDOS, e a única que responde "está VALENDO?" (auditoria de segurança
  # 2026-09-26). O gitleaks acima acha o que PARECE segredo; o TruffleHog com `--results=verified`
  # testa cada candidato contra a API do provedor e só acusa credencial que ainda autentica — então
  # não tem falso positivo para triar, e um achado aqui é rotação imediata, não investigação.
  # Varre o intervalo do push/PR (a action escolhe base e head pelo evento). SHA conferido com
  # `git ls-remote https://github.com/trufflesecurity/trufflehog refs/tags/v3.97.9`.
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --results=verified

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

  # SAST GENÉRICO, ao lado do CodeQL e das regras próprias.
  #
  # As seis regras de `audit/rules/ast-grep/` são invariantes DESTA casa (rota que fala com o banco,
  # `process.env` dentro de handler, `fetch` fora do funil) — elas não substituem um SAST, e um SAST
  # não substitui elas. Rodado à mão em 2026-09-09 sobre `server/` e `src/`, o Semgrep achou UM
  # aviso, e era o mesmo que a regra `resposta-crua` já acusava: uma confirmação independente de que
  # as regras da casa cobrem o que importa. Aqui ele entra para valer a cada push.
  #
  # `p/secrets` fica de fora: o gitleaks acima já varre o histórico inteiro, com allowlist nomeada.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Via pip, e nao pela imagem oficial nem pela action: as duas exigiriam fixar um digest, e
      # digest que ninguem consegue verificar de onde escreve o workflow e pior que versao fixada.
      # `==` e nao `>=`: um pacote de regras novo nao deve aparecer sem alguem decidir.
      - name: Instalar Semgrep
        run: pipx install semgrep==1.176.1
      - name: Semgrep (TypeScript, Node, Express, React)
        # `--error` faz o passo falhar em achado de severidade ERROR; WARNING aparece no log e não
        # barra — a severidade é do pacote de regras, e barrar em WARNING transformaria o gate numa
        # fila de exceções logo na primeira semana.
        run: semgrep --config=p/typescript --config=p/nodejs --config=p/expressjs --config=p/react --error --quiet server server.ts src
      # OS PACOTES DA AUDITORIA DE 2026-09-26 (`docs/pesquisa/2026-09-auditoria-seguranca-performance-dispositivos.md`
      # §1.5): OWASP Top 10, security-audit e secrets, além de javascript/nodejs/react. Rodados à mão
      # sobre `server server.ts src` deram ZERO achado ERROR (dois WARNING triados como falso
      # positivo em `openspec/audits/2026-09-26-seguranca/relatorio.md`), então `--error` entra sem
      # transformar o passo numa fila de exceções. `scripts/` e `.github/` ficam fora: são ferramentas
      # de bancada e CI, e os três ERROR que apareceram lá estão triados no mesmo relatório.
      - name: Semgrep (OWASP Top 10, security-audit, secrets)
        run: >-
          semgrep --config=p/javascript --config=p/nodejs --config=p/react --config=p/secrets
          --config=p/owasp-top-ten --config=p/security-audit --error --quiet server server.ts src
