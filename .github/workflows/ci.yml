name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (tag é ponteiro mutável); a versão legível fica no comentário,
      # que é o que o Dependabot atualiza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Primeiro de tudo: um workflow com YAML invalido nao falha, apenas nao roda. O uptime.yml
      # ficou assim de 31/08 a 07/09 sem ninguem ver (auditoria de 2026-09-07, achado A42).
      - name: YAML dos workflows
        run: npm run workflows:validar
      - run: npm run typecheck
      - run: npm run typecheck:core
      - run: npm run lint
      # CODIGO MORTO (auditoria de 2026-09-07, achados A50-A56): 15 arquivos sem importador,
      # dependencias sem uso e dois ciclos de importacao entraram porque nada os cobrava. Os dois
      # passos abaixo cobram, no dia em que o proximo entrar.
      #
      # A cobranca e sobre ARQUIVO, DEPENDENCIA e CICLO — nao sobre export sem uso. Um export sem
      # chamador e ruido de barril (`index.ts` reexporta o que cada tela importa da origem) e
      # produziria falha por algo que nao e defeito; arquivo orfao, dependencia que ninguem instala
      # por um motivo e ciclo de importacao nao tem leitura ambigua.
      - name: Sem arquivo, dependencia ou import nao declarado sobrando
        run: npm run morto:arquivos
      - name: Sem ciclo de importacao
        run: npm run morto:ciclos
      # O JSON da suite vai como artefato SEMPRE (`if: always()`): a run 34278328814 (08/09) falhou
      # em `npm test` e o log do job so e legivel por quem tem admin no repositorio — quem nao tem
      # ficava sem saber QUAL teste caiu. O artefato e publico para quem ve o repositorio.
      # COM COBERTURA e com piso (`coverage.thresholds` no vitest.config.ts): a rede de seguranca
      # da rodada de saneamento (Fase 1) so protege se a cobertura nao puder cair em silencio.
      - name: Testes de unidade e integracao (com cobertura e piso)
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=vitest-resultado.json
      - name: Artefato da cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
      - name: Artefato da suite (vitest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-resultado
          path: vitest-resultado.json
          if-no-files-found: ignore
      - run: npm run build
      # O catalogo pseudo tem que estar em dia, senao o teste de layout roda sobre um mapa velho
      # e deixa de ver as strings novas — falha silenciosa, do tipo que este repo ja documenta.
      - name: Catalogo pseudo em dia
        run: node scripts/i18n/pseudo.mjs --check

      # Chave de catalogo que sumiu do codigo. A chave de traducao E o texto portugues, entao
      # reescrever uma frase orfana a traducao dela em TODOS os idiomas — e o fallback e legivel,
      # ou seja, ninguem percebe olhando a tela. So um gate percebe.
      - name: Chaves de traducao orfas
        run: npm run i18n:orfas

      # A lista de idiomas que a interface OFERECE sai da cobertura medida de cada catalogo
      # (`src/data/i18n/cobertura.json`, versionado). Desatualizado, o seletor volta a oferecer um
      # idioma com 3% traduzido — que foi o achado A38 da auditoria de 2026-09-07.
      - name: Cobertura dos catalogos em dia
        run: node scripts/i18n/cobertura.mjs --check

      # A catraca: cobertura de i18n nao se perde por decisao, se perde por descuido, e o fallback
      # legivel esconde a perda. O piso so sobe; abaixa-lo exige justificativa no mesmo commit.
      #
      # 427 -> 420 em 07/09: os nove jogos culturais sairam da grade (change
      # `jogos-culturais-dentro-do-sistema`) e levaram junto 7 chamadas de `t()` — os rotulos dos
      # cards, a aba "Jogos do Mundo" e o selo "100% Funcional". Remocao deliberada de tela, nao
      # perda de cobertura: as chaves nem estavam traduzidas em `en.json`.
      - name: Piso de cobertura da interface
        run: node scripts/i18n/orfas.mjs --progresso --piso=420

      # Falha em HIGH/CRITICAL, exceto a allowlist NOMEADA das sem fix upstream.
      - name: Auditoria de dependências
        run: npm run audit:gate
      # O e2e existia e nenhum workflow o chamava. E agora ele carrega o teste de layout com
      # pseudo-localizacao, que e o unico que ve texto cortado antes de haver traducao para cortar.
      # `npm ci` nao baixa o navegador do Playwright; sem esta linha o passo abaixo falha com
      # "browser not found" em toda maquina limpa — o gate parecia existir e nunca podia passar.
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      # Trace e screenshot de falha ja eram configurados no playwright.config.ts e nunca saiam do
      # runner: a configuracao existia, a evidencia nao.
      - name: Artefato do e2e (trace, screenshot)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-resultado
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      # Invariantes arquiteturais deste repositório (não SAST genérico): as regras têm fixture,
      # porque uma regra errada devolve zero achados e isso tem a cara de "código limpo".
      # Toda rota do servidor tem teste de caracterizacao ou motivo escrito (Fase 1).
      - name: Rotas sem caracterizacao
        run: node scripts/testes/rotas-sem-caracterizacao.mjs
      - name: Regras arquiteturais (ast-grep)
        run: |
          ./node_modules/.bin/ast-grep test -c sgconfig.yml
          ./node_modules/.bin/ast-grep scan -c sgconfig.yml src server server.ts
