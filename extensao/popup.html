<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Frasy</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 260px;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: #222;
        background: #f6f3ea;
      }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #e8501f;
        cursor: pointer;
      }
      button[data-parar] {
        color: #222;
        background: #ddd8c8;
      }
      p {
        margin: 10px 0 0;
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <button id="botao" type="button">Legendar esta aba</button>
    <p id="estado">O som desta aba vai para o Frasy, neste aparelho. Nada é enviado à internet.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
