<!doctype html>
<!--
  PONTE DO VLIBRAS (piloto só para adultos; docs/pesquisa/2026-10-29-vlibras-piloto.md).
  Esta página é o ÚNICO lugar onde o widget do governo federal (vlibras.gov.br) roda. O Frasy a embute num
  <iframe sandbox="allow-scripts"> SEM allow-same-origin: origem opaca, sem acesso ao DOM, aos cookies nem ao
  localStorage do app. A CSP dela é própria (server/http/csp.ts, diretivasDaPonteDoVLibras) e, sem VLIBRAS_ATIVO=1,
  não deixa carregar nada. O script do governo só é pedido depois de uma mensagem do app (vlibras-ponte.js).
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>VLibras</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          16px/1.45 system-ui,
          sans-serif;
        background: #f5f5f5;
        color: #1b1b1b;
      }
      main {
        padding: 12px;
      }
      #texto {
        margin: 0;
        padding: 12px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #ccc;
        font-size: 18px;
        cursor: pointer;
      }
      #estado {
        margin: 8px 0 0;
        font-size: 13px;
        color: #444;
      }
      /* O botão flutuante do widget fica escondido: quem abre é o botão do Frasy. */
      #vlibras-access-wrapper {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="texto" role="status" aria-live="polite">Envie um trecho do Frasy para ver os sinais.</p>
      <p id="estado"></p>
    </main>
    <script src="/vlibras-ponte.js"></script>
  </body>
</html>
