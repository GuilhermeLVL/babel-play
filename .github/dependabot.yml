# Dependabot — Fase 5 do lançamento ampliou para a imagem Docker.
#
# npm: produção e desenvolvimento em PRs separados (um bump de devDependency não pode segurar uma
# correção de segurança de runtime). github-actions: as actions são fixadas por SHA, e é o
# Dependabot que as atualiza (o comentário ao lado do SHA diz a versão). docker: as imagens-base do
# Dockerfile (node:22-slim, debian:bookworm-slim) — o Litestream é fixado por versão+sha256 no
# próprio Dockerfile e atualizado à mão, com `docs/runbook.md` ao lado.
#
# COOLDOWN (auditoria de segurança 2026-09-26, Semgrep `dependabot-missing-cooldown`): uma versão
# precisa ter 7 dias de publicada antes de virar PR. É a janela em que um pacote sequestrado costuma
# ser denunciado e retirado (A03:2025, cadeia de suprimentos). Atualização DE SEGURANÇA não espera:
# o cooldown do Dependabot só vale para as atualizações de versão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
      producao:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
