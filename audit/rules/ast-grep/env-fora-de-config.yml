id: env-fora-de-config
language: TypeScript
severity: warning
message: >-
  `process.env` lido dentro de uma rota. Configuração espalhada pelos handlers torna o deploy
  irreprodutível e esconde de qualquer inventário quais variáveis o servidor realmente exige.
files:
  # O GLOB E FUNDO DE PROPOSITO. Ate 2026-09-09 era `server/routes/*.ts`, que casa com UM nivel:
  # no dia em que as rotas fossem para `server/dominios/<d>/rotas/`, a regra passaria a casar com
  # zero arquivo e a acusar zero violacao — com a cara de codigo limpo. Portao que passa sempre e
  # pior que portao nenhum. `**/rotas/` cobre a arvore por dominio antes de ela existir.
  - 'server/routes/**/*.ts'
  - 'server/**/rotas/**/*.ts'
rule:
  pattern: process.env.$NOME
