name: Bancada (Etapa 5)

# BANCADA DE MODELOS NOVOS — a Etapa 5 de openspec/audits/2026-09-28-eficiencia-ia/harness-adaptativo.md.
# Roda aqui, e não na máquina do dono, porque o Parakeet (0,6B) e o COMET (XLM-R large) não cabem
# ao lado do Chrome num computador de 16 GB; o ubuntu-latest tem 4 vCPU e 16 GB só para isto.
#
# Mede os CANDIDATOS e as LINHAS DE BASE da produção nos MESMOS casos — a regra de decisão da
# bancada é a diferença PAREADA com IC de 95% (docs/auditoria/eval/bancada-2026-09.md):
#   STT pt   parakeet:v3-int8, parakeet:tagarela-int8  ×  whisper base (o da produção, híbrido),
#            base q8 e small — em fleurs_pt, fleurs_pt_snr5 e sem_fala (taxa de alucinação)
#   STT en   parakeet:v3-int8  ×  moonshine-base q8 (o padrão local em inglês) — em fleurs_en
#   MT       bergamot:en-pt / bergamot:pt-en  ×  opus-mt — gold de conversa, FLEURS e WMT24++, COMET
# Todo STT com `+vad800`: o mesmo Silero e os mesmos limiares do navegador (fecha em 800 ms). Sem VAD
# a comparação mediria um pipeline que o usuário nunca vê.
#
# Sem segredo nenhum: nada de nuvem nesta execução (o livro-caixa da bancada fica em US$ 0). A bancada
# dos provedores de NUVEM (com as chaves e o teto de US$ 3) é o workflow irmão `bancada-nuvem.yml`.
# O resultado não volta para o repositório sozinho: sai no resumo do job e no artefato
# `bancada-etapa5` (resumo JSON + Markdown + brutos caso a caso). Quem decide a troca é o dono.

on:
  push:
    branches: ['bancada/**']
  workflow_dispatch:
    inputs:
      limite:
        description: 'Casos por conjunto (0 = todos; 5 = ensaio rápido do workflow)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: bancada-${{ github.ref }}
  cancel-in-progress: true

# O `npm ci` do onnxruntime-node baixa do nuget.org, no Linux x64, os binários de CUDA — o runner
# não tem GPU, e o nuget fora do ar derrubava o job antes de qualquer teste (ETIMEDOUT, 30/09/2026).
# Os binários de CPU vêm no próprio pacote do npm.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  bancada:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BANCADA_DIR: /home/runner/babel-bancada
      LIMITE: ${{ inputs.limite || '0' }}
      TSX: node node_modules/tsx/dist/cli.mjs
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # O piso de `engines.node` (>=22) — o mesmo Node do ci.yml.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/eval-fala/bancada/requirements.txt

      # Modelos (~6 GB: Parakeet ×2, COMET, Whisper small) + FLEURS não cabem com folga nos ~14 GB
      # livres do runner. SDKs que este job não usa saem primeiro.
      - name: Espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - run: npm ci
      - name: Python da bancada (torch só CPU)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r scripts/eval-fala/bancada/requirements.txt

      # Depois do `npm ci` (ele apaga node_modules, onde o transformers.js guarda os modelos em Node).
      # A chave é o HASH dos adaptadores, onde as revisões dos modelos estão FIXADAS; a revisão também
      # entra no caminho do arquivo em disco, então um cache parcial (restore-keys) nunca serve um
      # modelo velho no lugar do novo — no pior caso, baixa de novo.
      - name: Cache dos modelos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.BANCADA_DIR }}/cache/modelos
            ~/.cache/huggingface/hub
            node_modules/@huggingface/transformers/.cache
          key: bancada-modelos-v1-${{ hashFiles('scripts/eval-fala/bancada/parakeet.mjs', 'scripts/eval-fala/bancada/bergamot.mjs', 'scripts/eval-fala/bancada/requirements.txt') }}
          restore-keys: bancada-modelos-v1-

      # Amostra determinística (semente fixa): 300 falas por idioma, 100 derivadas (ruído), 400 WMT.
      # Sem ffmpeg no runner, as variantes Opus são puladas — esta etapa não as usa.
      - name: Dados da bancada
        run: python scripts/eval-fala/baixar-bancada.py

      # Tudo que os passos abaixo gravarem é mais novo que esta marca: é assim que o resumo pega
      # só os brutos DESTA execução, e não os versionados em docs/.
      - name: Marca de início
        run: touch "$RUNNER_TEMP/inicio"

      - name: STT pt (Parakeet v3 e TAGARELA × Whisper base/small)
        run: >
          $TSX scripts/eval-fala/bancada/stt.mjs --limite "$LIMITE"
          --sistemas parakeet:v3-int8+vad800,parakeet:tagarela-int8+vad800,local:base+vad800,local:base@q8+vad800,local:small+vad800
          --conjuntos fleurs_pt,fleurs_pt_snr5,sem_fala

      - name: STT en (Parakeet v3 × Moonshine base q8)
        run: >
          $TSX scripts/eval-fala/bancada/stt.mjs --limite "$LIMITE"
          --sistemas parakeet:v3-int8+vad800,local:moonshine-base@q8+vad800
          --conjuntos fleurs_en

      - name: MT en→pt (Bergamot × opus-mt)
        run: >
          $TSX scripts/eval-fala/bancada/mt.mjs --limite "$LIMITE"
          --sistemas local:opus-mt,bergamot:en-pt
          --corpora gold:en-pt,fleurs:en-pt,wmt:en-pt

      - name: MT pt→en (Bergamot × opus-mt)
        run: >
          $TSX scripts/eval-fala/bancada/mt.mjs --limite "$LIMITE"
          --sistemas local:opus-mt,bergamot:pt-en
          --corpora fleurs:pt-en

      - name: COMET
        run: |
          mapfile -t brutos < <(find docs/auditoria/eval/bancada-2026-09 -name 'mt_*.json' -newer "$RUNNER_TEMP/inicio")
          python scripts/eval-fala/bancada/pontuar.py "${brutos[@]}"

      - name: Resumo pareado
        if: always()
        run: |
          mapfile -t brutos < <(find docs/auditoria/eval/bancada-2026-09 -name '*.json' -newer "$RUNNER_TEMP/inicio" | sort)
          mkdir -p "$RUNNER_TEMP/bancada/brutos"
          if [ "${#brutos[@]}" -eq 0 ]; then echo "nenhum bruto gerado" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          cp "${brutos[@]}" "$RUNNER_TEMP/bancada/brutos/"
          $TSX scripts/eval-fala/bancada/resumo.mjs --saida "$RUNNER_TEMP/bancada" --titulo "Bancada — candidatos × linhas de base (Etapa 5)" "${brutos[@]}"
          cat "$RUNNER_TEMP/bancada/resumo-bancada.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bancada-etapa5
          path: ${{ runner.temp }}/bancada/
          if-no-files-found: warn
          retention-days: 30
