# Dependabot — Fase 5 do lançamento ampliou para a imagem Docker.
#
# npm: produção e desenvolvimento em PRs separados (um bump de devDependency não pode segurar uma
# correção de segurança de runtime). github-actions: as actions são fixadas por SHA, e é o
# Dependabot que as atualiza (o comentário ao lado do SHA diz a versão). docker: as imagens-base do
# Dockerfile (node:22-slim) do self-host.
#
# COOLDOWN (auditoria de segurança 2026-09-26, Semgrep `dependabot-missing-cooldown`): uma versão
# precisa ter 7 dias de publicada antes de virar PR. É a janela em que um pacote sequestrado costuma
# ser denunciado e retirado (A03:2025, cadeia de suprimentos). Atualização DE SEGURANÇA não espera:
# o cooldown do Dependabot só vale para as atualizações de versão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
      producao:
        dependency-type: production
        update-types: [minor, patch]
    # Seguradas de propósito (20/11/2026); cada uma volta numa migração própria. Sem isto, os
    # grupos reabrem toda semana trazendo-as junto e o PR inteiro fica impossível de mergear.
    ignore:
      # Runtime de IA: o ort-wasm-simd-threaded.jsep.wasm da 1.31 tem 28,2 MiB (Worker aceita 25 MiB).
      - dependency-name: onnxruntime-web
        versions: ['>=1.31.0']
      - dependency-name: '@huggingface/transformers'
        versions: ['>=4.3.2']
      - dependency-name: '@ricky0123/vad-web'
        versions: ['>=0.0.31']
      # pglite 0.5.17: close() trava com transação aberta (tests/worker/ciclo-do-cliente.test.ts).
      - dependency-name: '@electric-sql/pglite'
        versions: ['>=0.5.17']
      # Majors de ferramentas e do servidor: migração própria.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      - dependency-name: js-yaml
        update-types: [version-update:semver-major]
      - dependency-name: autocannon
        update-types: [version-update:semver-major]
      - dependency-name: '@dicebear/*'
        update-types: [version-update:semver-major]
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: '@types/express'
        update-types: [version-update:semver-major]
      - dependency-name: prettier
        versions: ['>=3.9.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init e analyze do CodeQL precisam da MESMA versão (o analyze recusa a config de outra
      # versão do init): sobem juntos num PR só.
      codeql:
        patterns: ['github/codeql-action*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
