<!doctype html>
<!--
  A PÁGINA DE ANÚNCIOS DO FRASY (ruling R32). Mora na ORIGEM DE ANÚNCIOS (`ANUNCIOS_ORIGEM`) e é embutida
  pelo app com `<iframe credentialless>`. É a ÚNICA página que carrega o GPT do Google, e só quando a
  própria query traz `consentimento=1` (o app só a abre depois do consentimento). Servida SEM
  COOP/COEP/DIP e com a CSP própria (bloco `/anuncios/*` do `_headers`, `scripts/vite/cabecalhos.ts`).
  Sem bundler: o comportamento está em `espaco.js`, ao lado.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Patrocinado</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #espaco {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="espaco"></div>
    <script src="/anuncios/espaco.js" defer></script>
  </body>
</html>
