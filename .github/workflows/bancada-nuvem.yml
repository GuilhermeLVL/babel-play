name: Bancada de nuvem (B5)

# BANCADA DE PROVEDORES DE NUVEM — o B5 do plano: mede DeepInfra, Cerebras e Cloudflare Workers AI
# contra a produção de hoje (Groq) com o MESMO pedido que a produção manda (`bancada/nuvem.mjs`:
# prompt comunicativo, temperatura da fala, max_tokens proporcional, parametrosDoProvedor), ANTES de
# qualquer troca de modelo — o B7 só troca os padrões com a decisão desta execução.
#
# SÓ MANUAL (workflow_dispatch): cada execução gasta dinheiro do dono.
#
# TETO DE US$ 3 POR EXECUÇÃO. `BANCADA_TETO_USD=3` e o livro-caixa (`bancada/livroCaixa.mjs`)
# RESERVA o pior caso de cada chamada antes de ela sair (max_tokens inteiro de saída, 1 token por
# caractere de entrada, o mínimo faturado do STT) e recusa a que passaria do teto: a bancada para
# ANTES de passar, não depois. O runner começa sem `gasto.json`, então o teto é desta execução, e as
# etapas somam no mesmo arquivo. Estimativa da execução completa pela tabela: ~US$ 1 (MT ~0,80; STT ~0,21).
#
# SEGREDOS DO REPOSITÓRIO (Settings → Secrets and variables → Actions). O que faltar é PULADO com
# aviso — sem nenhum, a execução inteira é um ensaio de US$ 0:
#   GROQ_API_KEY            a linha de base (a produção de hoje). A camada gratuita (200 mil tokens/dia
#                           por modelo) não cobre a execução completa: use a chave Developer
#   DEEPINFRA_API_KEY       DeepInfra
#   CEREBRAS_API_KEY        Cerebras
#   CLOUDFLARE_ACCOUNT_ID   Workers AI: id da conta (32 hex)
#   CLOUDFLARE_AI_TOKEN     Workers AI: token SÓ com a permissão "Workers AI" — separado de qualquer
#                           token de deploy; chega aos scripts como CLOUDFLARE_API_TOKEN
#   OPENROUTER_API_KEY      opcional (só a sonda; sempre com zdr e sem o Google)
# Os segredos entram SÓ nas etapas que chamam os provedores — o `npm ci` e o pip não os veem.
# Nunca a API do Gemini (o app atende menores): `nuvem.mjs` recusa.
#
# O resultado não volta ao repositório: sai no resumo do job e no artefato `bancada-nuvem` (sonda de
# contrato, resumo pareado, decisão, livro-caixa e brutos caso a caso). Quem troca é o dono.
# Como ler: docs/auditoria/eval/bancada-nuvem.md.

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Casos por conjunto (0 = todos; 3 = ensaio barato do workflow)'
        required: false
        default: '0'
      seguir_apesar_da_sonda:
        description: 'Rodar a bancada mesmo se a sonda de contrato achar violação (o provedor quebrado sai com erro por caso)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Uma execução paga não é cancelada no meio por outra: a segunda espera.
concurrency:
  group: bancada-nuvem
  cancel-in-progress: false

jobs:
  nuvem:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BANCADA_DIR: /home/runner/babel-bancada
      BANCADA_TETO_USD: '3'
      LIMITE: ${{ inputs.limite }}
      TSX: node node_modules/tsx/dist/cli.mjs
      HF_HUB_DISABLE_TELEMETRY: '1'
      # Os de nuvem: a Groq de hoje (linha de base) e os candidatos. `@none` = sem pensamento (ajuste
      # de candidato que a produção ainda não manda; a decisão avisa).
      MT_SISTEMAS: >-
        groq:openai/gpt-oss-120b,groq:openai/gpt-oss-20b,deepinfra:openai/gpt-oss-20b,deepinfra:openai/gpt-oss-120b,deepinfra:Qwen/Qwen3.5-9B@none,deepinfra:google/gemma-4-26B-A4B-it,cerebras:gpt-oss-120b,cloudflare:@cf/openai/gpt-oss-20b,cloudflare:@cf/openai/gpt-oss-120b,cloudflare:@cf/google/gemma-4-26b-a4b-it
      # O pipeline de STT da produção (`+t0+seg`) atrás do mesmo VAD do navegador (fecha em 800 ms):
      # o mínimo faturado entra por trecho, como na produção. O Cloudflare não tem temperatura na API.
      STT_SISTEMAS: >-
        groq:whisper-large-v3-turbo+t0+seg+vad800,deepinfra:openai/whisper-large-v3-turbo+t0+seg+vad800,cloudflare:@cf/openai/whisper-large-v3-turbo+seg+vad800
      CANDIDATOS: 'deepinfra:,cerebras:,cloudflare:,groq:openai/gpt-oss-20b'
    steps:
      # Um limite que não é número viraria 0 = execução COMPLETA dentro dos scripts.
      - name: Entrada
        run: |
          if ! [[ "$LIMITE" =~ ^[0-9]+$ ]]; then echo "limite inválido: use um número (0 = todos)"; exit 1; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/eval-fala/bancada/requirements.txt

      - run: npm ci

      # PRIMEIRO a sonda (segundos, centésimos de centavo): se uma API mudou de contrato, a execução
      # para aqui, antes de baixar dados e de gastar com a bancada inteira.
      - name: Sonda de contrato das APIs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGUIR: ${{ inputs.seguir_apesar_da_sonda }}
        run: |
          mkdir -p "$RUNNER_TEMP/bancada"
          extra=()
          if [ "$SEGUIR" = "true" ]; then extra=(--nao-falhar); fi
          set +e
          $TSX scripts/eval-fala/bancada/sondar-contratos.mjs --saida "$RUNNER_TEMP/bancada/sonda" "${extra[@]}"
          codigo=$?
          set -e
          cat "$RUNNER_TEMP/bancada/sonda/sonda-contratos.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit $codigo

      - name: Espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Python da bancada (torch só CPU, para o COMET)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r scripts/eval-fala/bancada/requirements.txt

      - name: Cache do COMET
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface/hub
          key: bancada-nuvem-comet-v1-${{ hashFiles('scripts/eval-fala/bancada/requirements.txt') }}
          restore-keys: bancada-nuvem-comet-v1-

      # A mesma amostra determinística da bancada de 24/09 (semente fixa): FLEURS pt/en, ruído, ESC-50
      # sem fala, FLEURS en↔pt e WMT24++.
      - name: Dados da bancada
        run: python scripts/eval-fala/baixar-bancada.py

      # Tudo que as etapas abaixo gravarem é mais novo que esta marca: o resumo pega só os brutos
      # DESTA execução, e não os versionados em docs/.
      - name: Marca de início
        run: touch "$RUNNER_TEMP/inicio"

      - name: STT pt (Groq × DeepInfra × Workers AI)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: >
          $TSX scripts/eval-fala/bancada/stt.mjs --limite "$LIMITE"
          --sistemas "$STT_SISTEMAS"
          --conjuntos fleurs_pt,fleurs_pt_snr5,sem_fala

      - name: STT en (Groq × DeepInfra × Workers AI)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: >
          $TSX scripts/eval-fala/bancada/stt.mjs --limite "$LIMITE"
          --sistemas "$STT_SISTEMAS"
          --conjuntos fleurs_en

      # O gold de conversa vem PRIMEIRO (o mt.mjs roda um corpus em todos os sistemas antes do
      # próximo): se o teto ou uma cota pararem a execução, o corpus que decide já está medido.
      # WMT numa amostra estratificada de 200 (a mesma semente) na execução completa.
      - name: MT en→pt (gold de conversa, FLEURS, WMT24++)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          wmt='wmt:en-pt#200'
          if [ "$LIMITE" != "0" ]; then wmt='wmt:en-pt'; fi
          $TSX scripts/eval-fala/bancada/mt.mjs --limite "$LIMITE" --sistemas "$MT_SISTEMAS" --corpora "gold:en-pt,fleurs:en-pt,$wmt"

      - name: MT pt→en (FLEURS)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: >
          $TSX scripts/eval-fala/bancada/mt.mjs --limite "$LIMITE"
          --sistemas "$MT_SISTEMAS"
          --corpora fleurs:pt-en

      # Sem nenhum bruto de MT o pontuar.py pegaria os VERSIONADOS em docs/ — daí a guarda.
      - name: COMET
        run: |
          mapfile -t brutos < <(find docs/auditoria/eval/bancada-2026-09 -name 'mt_*.json' -newer "$RUNNER_TEMP/inicio")
          if [ "${#brutos[@]}" -eq 0 ]; then echo "nenhum bruto de MT"; exit 0; fi
          python scripts/eval-fala/bancada/pontuar.py "${brutos[@]}"

      - name: Resumo pareado e decisão
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/bancada/brutos"
          cp "$BANCADA_DIR/gasto.json" "$RUNNER_TEMP/bancada/" 2>/dev/null || echo '{"totalUsd":0}' > "$RUNNER_TEMP/bancada/gasto.json"
          node -e "const g=require(process.argv[1]); console.log('**Gasto desta execução:** US\$ ' + g.totalUsd.toFixed(4) + ' (teto US\$ ' + process.env.BANCADA_TETO_USD + ')')" "$RUNNER_TEMP/bancada/gasto.json" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$RUNNER_TEMP/inicio" ]; then exit 0; fi
          mapfile -t brutos < <(find docs/auditoria/eval/bancada-2026-09 -name '*.json' -newer "$RUNNER_TEMP/inicio" | sort)
          if [ "${#brutos[@]}" -eq 0 ]; then echo "nenhum bruto gerado" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          cp "${brutos[@]}" "$RUNNER_TEMP/bancada/brutos/"
          $TSX scripts/eval-fala/bancada/resumo.mjs --saida "$RUNNER_TEMP/bancada" --candidatos "$CANDIDATOS" --titulo 'Bancada de nuvem (B5) — candidatos × produção' "${brutos[@]}"
          $TSX scripts/eval-fala/bancada/decisao.mjs --resumo "$RUNNER_TEMP/bancada/resumo-bancada.json" --saida "$RUNNER_TEMP/bancada"
          cat "$RUNNER_TEMP/bancada/decisao-bancada.md" "$RUNNER_TEMP/bancada/resumo-bancada.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bancada-nuvem
          path: ${{ runner.temp }}/bancada/
          if-no-files-found: warn
          retention-days: 30
