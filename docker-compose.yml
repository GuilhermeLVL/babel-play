# Babel Play — modo PÚBLICO multi-usuário.
#
#   cp .env.docker.example .env.docker   (e preencha)
#   docker compose --env-file .env.docker up -d --build
#   curl -fsS http://localhost:3000/api/health
#
# O `--env-file` NÃO é opcional: sem ele o compose usa o `.env` da raiz (que tem a
# configuração LOCAL de desenvolvimento) para substituir as variáveis abaixo, e a
# imagem sairia com o Supabase errado embutido no bundle do cliente.
#
# HTTPS fica a cargo do proxy reverso na frente (Caddy/Traefik/nginx). O app não
# termina TLS — e `AUTH_REQUIRED=1` sem HTTPS entrega o token em texto claro.

services:
  app:
    build:
      context: .
      # As VITE_* precisam chegar no BUILD (o Vite as embute no bundle do cliente),
      # não só no runtime — senão a SPA sobe sem tela de login.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?defina no .env.docker}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?defina no .env.docker}
        VITE_AUTH_REQUIRED: '1'
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Modo público: exige JWT do Supabase em toda rota /api.
      # Também DESLIGA por design as capacidades locais — /api/audio/* responde 403
      # mesmo autenticado (roda WASAPI no servidor; não existe num deploy hospedado).
      # POST /api/import/youtube foi aposentada (410 em qualquer modo).
      AUTH_REQUIRED: '1'
      NODE_ENV: production
      # Postgres do serviço `postgres` abaixo, para exercitar o driver `pg` de verdade. Em produção
      # a DATABASE_URL do .env.docker (um Postgres gerenciado) tem precedência. A senha é só de teste local.
      DATABASE_URL: ${DATABASE_URL:-postgres://babel:babel-local@postgres:5432/babel}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Só no loopback do host: quem publica na internet é o proxy reverso.
      - '127.0.0.1:3000:3000'
    volumes:
      # Áudios das sessões. SEM isto o dado morre a cada `docker compose up`. O banco mora no
      # volume do serviço `postgres`.
      - babel-data:/data
    # /api/ready, e nao /api/health — ver o bloco do HEALTHCHECK no Dockerfile. Quem le este
    # estado (depends_on: service_healthy, Swarm, proxy reverso) decide ROTEAR, nao reiniciar: e
    # readiness. O health responde 200 numa instancia que subiu com o banco na versao anterior.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    # Teto de memória: o servidor é CRUD + proxy (a inferência roda no navegador),
    # mas o import de documento carrega PDF/DOCX na memória.
    deploy:
      resources:
        limits:
          memory: 1g

  # Postgres 17, o mesmo major do PGlite de desenvolvimento. Serve para testar o driver `pg` de
  # verdade; em produção use um Postgres gerenciado e aponte DATABASE_URL para ele.
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: babel
      POSTGRES_PASSWORD: babel-local
      POSTGRES_DB: babel
    volumes:
      - babel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U babel -d babel']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  babel-data:
  babel-pg:
