# DEPLOY NO FLY.IO — manual, por imagem com TAG IMUTÁVEL, com rollback pelo mesmo botão.
#
# Actions → "Deploy (Fly.io)" → Run workflow:
#   - ambiente: staging ou production (cada um é um Environment do GitHub com as próprias variáveis
#     e secrets — em production, ligue "Required reviewers" para o deploy pedir aprovação);
#   - imagem: VAZIO = constrói o commit escolhido e publica como `registry.fly.io/<app>:<sha>`;
#             PREENCHIDO = ROLLBACK: reimplanta uma imagem que já existe, sem construir nada.
#
# ROLLBACK EM 1 MINUTO: `fly releases --image --app <app>` lista as imagens de cada release; rode
# este workflow com `imagem: registry.fly.io/<app>:<sha-anterior>`. Nada é reconstruído — é a MESMA
# imagem que já esteve no ar. (Migração de banco não volta junto: ver docs/runbook.md, "Rollback".)
#
# Variáveis do Environment (Settings → Environments → <ambiente>):
#   vars.FLY_APP                  nome do app no Fly (babel-play / babel-play-staging)
#   vars.URL_PUBLICA              https://… do ambiente (fumaça pós-deploy e canonical)
#   vars.VITE_SUPABASE_URL        URL do projeto Supabase (pública)
#   vars.VITE_SUPABASE_ANON_KEY   anon key (pública por desenho)
#   vars.VITE_SELF_HOST_MODELS    https://<bucket público dos modelos> (opcional)
#   vars.VITE_SENTRY_DSN          DSN do Sentry do navegador (opcional; é público por desenho)
#   secrets.FLY_API_TOKEN         `fly tokens create deploy --app <app>` (só deploy, só este app)
#
# PORTÃO DE CI (P0-5, auditoria de prontidão): antes de qualquer coisa, o workflow confere na API do
# GitHub que o `ci.yml` terminou com `success` para o SHA EXATO que vai ao ar — o commit escolhido,
# ou, no rollback, o commit da tag da imagem. Sem isso o botão implantava qualquer ref, inclusive
# uma com teste vermelho ou uma cujo CI nem rodou. EMERGÊNCIA: `pular_gate_ci` desliga o portão,
# mas só com `justificativa_pular_gate` preenchida; quem pulou, o SHA e o motivo vão para o resumo
# da execução (e ficam no histórico do Actions).
#
# Toda entrada do formulário e toda variável chega aos `run:` por `env:`, nunca por `${{ }}` dentro
# do script: o campo `imagem` é texto livre, e interpolado direto no shell viraria injeção de comando.
name: Deploy (Fly.io)

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Para onde'
        type: choice
        options: [staging, production]
        default: staging
      imagem:
        description: 'Rollback: imagem já publicada (registry.fly.io/<app>:<sha>). Vazio = construir este commit.'
        type: string
        required: false
      pular_gate_ci:
        description: 'EMERGÊNCIA: implantar sem CI verde para este SHA (exige justificativa)'
        type: boolean
        default: false
      justificativa_pular_gate:
        description: 'Obrigatória se pular_gate_ci: por que implantar sem CI verde (fica no resumo)'
        type: string
        required: false

# `actions: read` é o que o portão de CI precisa para listar as execuções do `ci.yml`.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
      AMBIENTE: ${{ inputs.ambiente }}
      IMAGEM_INFORMADA: ${{ inputs.imagem }}
      PULAR_GATE_CI: ${{ inputs.pular_gate_ci }}
      JUSTIFICATIVA_PULAR_GATE: ${{ inputs.justificativa_pular_gate }}
      URL_PUBLICA: ${{ vars.URL_PUBLICA }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SELF_HOST_MODELS: ${{ vars.VITE_SELF_HOST_MODELS }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      # PRIMEIRO passo, antes de checkout e de qualquer build: um SHA sem CI verde não chega nem a
      # virar imagem. O SHA vem do commit escolhido ou, no rollback, da tag da imagem informada.
      - name: Portão de CI (ci.yml verde para o SHA que será implantado)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGEM_INFORMADA" ]; then
            tag="${IMAGEM_INFORMADA##*:}"
            echo "$tag" | grep -Eq '^[0-9a-f]{7,40}$' \
              || { echo "::error::a tag da imagem de rollback precisa ser um sha de commit"; exit 1; }
            # A API filtra por `head_sha` COMPLETO e a tag pode ser curta: resolve o sha primeiro.
            sha=$(gh api "repos/$REPO/commits/$tag" --jq .sha)
          else
            sha="$GITHUB_SHA"
          fi
          echo "SHA_IMPLANTADO=$sha" >> "$GITHUB_ENV"

          if [ "$PULAR_GATE_CI" = "true" ]; then
            justificativa="$(printf '%s' "$JUSTIFICATIVA_PULAR_GATE" | tr '\r\n' '  ' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if [ "${#justificativa}" -lt 10 ]; then
              echo "::error::pular_gate_ci exige justificativa_pular_gate (10+ caracteres), que fica registrada no resumo"
              exit 1
            fi
            echo "::warning::PORTAO DE CI PULADO por $GITHUB_ACTOR para $sha"
            {
              echo "### Portão de CI PULADO (emergência)"
              echo "- SHA: \`$sha\`"
              echo "- quem: @$GITHUB_ACTOR"
              echo "- justificativa: $justificativa"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Pelo menos uma execução do ci.yml concluída com success para ESTE sha. O `select` repete
          # o filtro do lado de cá: se a API ignorasse o parâmetro, o portão não passaria a aceitar
          # o CI verde de outro commit.
          sucessos=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$sha\" and .conclusion == \"success\")] | length")
          if [ "$sucessos" -lt 1 ]; then
            echo "::error::o ci.yml não tem execução com conclusão success para $sha. Espere/rode o CI, ou, em emergência, use pular_gate_ci com justificativa."
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=5" \
              --jq '.workflow_runs[] | "  execução \(.id): \(.status)/\(.conclusion // "-") (\(.event))"' || true
            exit 1
          fi
          echo "ci.yml verde para $sha ($sucessos execução(ões) com success)"
          echo "### Portão de CI: ci.yml verde para \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Conferir configuração do ambiente
        run: |
          test -n "$FLY_API_TOKEN" || { echo "::error::secret FLY_API_TOKEN ausente no environment $AMBIENTE"; exit 1; }
          test -n "$FLY_APP" || { echo "::error::variável FLY_APP ausente no environment $AMBIENTE"; exit 1; }
          if [ -n "$IMAGEM_INFORMADA" ]; then
            # Só aceita imagem do registro do PRÓPRIO app, com tag de commit — nada de imagem de fora.
            echo "$IMAGEM_INFORMADA" | grep -Eq "^registry\.fly\.io/${FLY_APP}:[0-9a-f]{7,40}$" \
              || { echo "::error::imagem de rollback deve ser registry.fly.io/${FLY_APP}:<sha>"; exit 1; }
          fi

      - name: Construir e publicar a imagem (tag = commit)
        if: inputs.imagem == ''
        run: |
          flyctl deploy --app "$FLY_APP" --remote-only --build-only --push \
            --image-label "$GITHUB_SHA" \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            --build-arg VITE_PUBLIC_URL="$URL_PUBLICA" \
            --build-arg VITE_SELF_HOST_MODELS="$VITE_SELF_HOST_MODELS" \
            --build-arg VITE_SENTRY_DSN="$VITE_SENTRY_DSN" \
            --build-arg VERSAO="$GITHUB_SHA"
          echo "IMAGEM=registry.fly.io/${FLY_APP}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Rollback — usar a imagem informada
        if: inputs.imagem != ''
        run: echo "IMAGEM=$IMAGEM_INFORMADA" >> "$GITHUB_ENV"

      - name: Implantar
        run: |
          echo "implantando $IMAGEM em $FLY_APP"
          flyctl deploy --app "$FLY_APP" --image "$IMAGEM" --strategy immediate --wait-timeout 300

      - name: Fumaça pós-deploy (/api/ready pelo domínio público)
        if: vars.URL_PUBLICA != ''
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$URL_PUBLICA/api/ready" || true)
            [ "$codigo" = "200" ] && { echo "pronto"; exit 0; }
            sleep 5
          done
          echo "::error::/api/ready não respondeu 200 — considere o rollback (rode este workflow com a imagem anterior)"
          exit 1

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy $AMBIENTE"
            echo "- app: \`$FLY_APP\`"
            echo "- imagem: \`${IMAGEM:-(não chegou a ser definida)}\`"
            echo "- rollback: rode este workflow com \`imagem\` = a imagem da release anterior (\`fly releases --image --app $FLY_APP\`)"
          } >> "$GITHUB_STEP_SUMMARY"
