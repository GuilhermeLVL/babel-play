name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (tag é ponteiro mutável); a versão legível fica no comentário,
      # que é o que o Dependabot atualiza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Primeiro de tudo: um workflow com YAML invalido nao falha, apenas nao roda. O uptime.yml
      # ficou assim de 31/08 a 07/09 sem ninguem ver (auditoria de 2026-09-07, achado A42).
      - name: YAML dos workflows
        run: npm run workflows:validar
      - run: npm run typecheck
      - run: npm run typecheck:core
      # `strict` LIGADO na arvore inteira. O `tsconfig.json` da raiz nunca teve `strict`, e a Fase 3
      # zerou os 81 erros que ele acusava (30 vinham de uma assinatura so, em `lazyComRecarga`).
      # Este passo impede que o proximo entre: nao ha lista de pendentes porque nao sobrou nenhum.
      - run: npm run typecheck:estrito
      - run: npm run lint
      # CODIGO MORTO (auditoria de 2026-09-07, achados A50-A56): 15 arquivos sem importador,
      # dependencias sem uso e dois ciclos de importacao entraram porque nada os cobrava. Os dois
      # passos abaixo cobram, no dia em que o proximo entrar.
      #
      # A cobranca e sobre ARQUIVO, DEPENDENCIA e CICLO — nao sobre export sem uso. Um export sem
      # chamador e ruido de barril (`index.ts` reexporta o que cada tela importa da origem) e
      # produziria falha por algo que nao e defeito; arquivo orfao, dependencia que ninguem instala
      # por um motivo e ciclo de importacao nao tem leitura ambigua.
      - name: Sem arquivo, dependencia ou import nao declarado sobrando
        run: npm run morto:arquivos
      - name: Sem ciclo de importacao
        run: npm run morto:ciclos
      # O JSON da suite vai como artefato SEMPRE (`if: always()`): a run 34278328814 (08/09) falhou
      # em `npm test` e o log do job so e legivel por quem tem admin no repositorio — quem nao tem
      # ficava sem saber QUAL teste caiu. O artefato e publico para quem ve o repositorio.
      # COM COBERTURA e com piso (`coverage.thresholds` no vitest.config.ts): a rede de seguranca
      # da rodada de saneamento (Fase 1) so protege se a cobertura nao puder cair em silencio.
      - name: Testes de unidade e integracao (com cobertura e piso)
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=vitest-resultado.json
      - name: Artefato da cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
      - name: Artefato da suite (vitest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-resultado
          path: vitest-resultado.json
          if-no-files-found: ignore
      - run: npm run build
      # O catalogo pseudo tem que estar em dia, senao o teste de layout roda sobre um mapa velho
      # e deixa de ver as strings novas — falha silenciosa, do tipo que este repo ja documenta.
      - name: Catalogo pseudo em dia
        run: node scripts/i18n/pseudo.mjs --check

      # Chave de catalogo que sumiu do codigo. A chave de traducao E o texto portugues, entao
      # reescrever uma frase orfana a traducao dela em TODOS os idiomas — e o fallback e legivel,
      # ou seja, ninguem percebe olhando a tela. So um gate percebe.
      - name: Chaves de traducao orfas
        run: npm run i18n:orfas

      # A lista de idiomas que a interface OFERECE sai da cobertura medida de cada catalogo
      # (`src/data/i18n/cobertura.json`, versionado). Desatualizado, o seletor volta a oferecer um
      # idioma com 3% traduzido — que foi o achado A38 da auditoria de 2026-09-07.
      - name: Cobertura dos catalogos em dia
        run: node scripts/i18n/cobertura.mjs --check

      # A catraca: cobertura de i18n nao se perde por decisao, se perde por descuido, e o fallback
      # legivel esconde a perda. O piso so sobe; abaixa-lo exige justificativa no mesmo commit.
      #
      # 427 -> 420 em 07/09: os nove jogos culturais sairam da grade (change
      # `jogos-culturais-dentro-do-sistema`) e levaram junto 7 chamadas de `t()` — os rotulos dos
      # cards, a aba "Jogos do Mundo" e o selo "100% Funcional". Remocao deliberada de tela, nao
      # perda de cobertura: as chaves nem estavam traduzidas em `en.json`.
      #
      # 420 -> 415 em 12/09 (redesign v4). Cinco elementos sairam da tela Inicio, nao cinco
      # traducoes: o rotulo "Seu estudo" e a frase de apoio do cabecalho, que no perfil
      # Produtividade o design nao tem; o subtitulo "Retencao, tempo de estudo e evolucao
      # semanal" do cartao de estatisticas, que virou link; e os rotulos "Expandir"/"Ocultar"
      # daquele mesmo controle, cujo estado agora vem de `aria-expanded` em vez de texto.
      # As frases REESCRITAS (titulo do Inicio, os tres pilares) nao contam aqui: elas
      # continuam passando por `t()` e ganharam chave nova em `en.json` no mesmo commit.
      - name: Piso de cobertura da interface
        run: node scripts/i18n/orfas.mjs --progresso --piso=415

      # Falha em HIGH/CRITICAL, exceto a allowlist NOMEADA das sem fix upstream.
      - name: Auditoria de dependências
        run: npm run audit:gate
      # O e2e existia e nenhum workflow o chamava. E agora ele carrega o teste de layout com
      # pseudo-localizacao, que e o unico que ve texto cortado antes de haver traducao para cortar.
      # `npm ci` nao baixa o navegador do Playwright; sem esta linha o passo abaixo falha com
      # "browser not found" em toda maquina limpa — o gate parecia existir e nunca podia passar.
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      # Trace e screenshot de falha ja eram configurados no playwright.config.ts e nunca saiam do
      # runner: a configuracao existia, a evidencia nao.
      - name: Artefato do e2e (trace, screenshot)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-resultado
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      # Invariantes arquiteturais deste repositório (não SAST genérico): as regras têm fixture,
      # porque uma regra errada devolve zero achados e isso tem a cara de "código limpo".
      # Toda rota do servidor tem teste de caracterizacao ou motivo escrito (Fase 1).
      - name: Rotas sem caracterizacao
        run: node scripts/testes/rotas-sem-caracterizacao.mjs
      # E toda rota tem quem a chame — a pergunta do outro lado (Fase 2). `rotas-espelhadas`
      # cobra que a rota que o cliente chama exista sem conta; esta cobra que a rota que o
      # servidor registra tenha consumidor, que foi como `POST /api/ai/llm/chat/completions`
      # ficou orfa sem nada acusar (achado A52 de 2026-09-07).
      - name: Rotas sem consumidor
        run: node scripts/testes/rotas-sem-consumidor.mjs
      # E nenhuma rota /api some sem passar pela depreciação (Fase 6 da prontidão): a aba aberta
      # com o bundle anterior, e o servidor anterior num rollback, dependem dela. Mesmo censo do
      # passo de cima (`scripts/testes/_rotas-do-servidor.mjs`); política em docs/versionamento.md.
      - name: Contrato da API (remoção só após depreciação)
        run: npm run contrato:api
      - name: Regras arquiteturais (ast-grep)
        run: |
          ./node_modules/.bin/ast-grep test -c sgconfig.yml
          ./node_modules/.bin/ast-grep scan -c sgconfig.yml src server server.ts

  # MIGRATIONS EXPAND/CONTRACT (Fase 6 da prontidão). As migrations rodam no boot, só para a frente,
  # e o rollback troca a IMAGEM sem voltar o banco: migration nova só ACRESCENTA, salvo marcador
  # `-- CONTRATO:` numa migration que venha sozinha (sem código de servidor/cliente no mesmo diff).
  # Job próprio porque precisa do histórico (`fetch-depth: 0`) para o `git diff` contra a base, e
  # não precisa de `npm ci` (o script só usa módulos do Node). Regras em docs/versionamento.md §3.
  migracoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # PR: compara com a branch de destino. Push: com o commit anterior do push (vazio/zeros numa
      # branch nova — aí o script cobra só o marcador e avisa).
      - name: Portão expand/contract
        env:
          BASE_PR: ${{ github.base_ref }}
          ANTES_DO_PUSH: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_PR" ]; then base="origin/$BASE_PR"; else base="$ANTES_DO_PUSH"; fi
          node scripts/migracoes/conferir.mjs --base="$base"

  # CARGA LEVE E ORÇAMENTO DO BUNDLE (Fases 6 e 4 da prontidão). Todos os limiares vêm de UM
  # arquivo, `scripts/perf/suite/slo.json` (a fonte de `docs/slo.md`): mudar um teto é mudar o JSON
  # e o documento, no mesmo commit, com a justificativa.
  #   1. orçamento do bundle: JS e CSS iniciais em gzip abaixo do teto (o medido + 10%) e nenhum
  #      arquivo só de desenvolvimento (protótipo de design, lucide.min.js) no `dist`;
  #   2. autocannon nas rotas baratas (servidor BUILDADO, banco vazio, self-host: mede a rota, não a
  #      borda), p95 abaixo do SLO de leitura e zero erro/não-2xx;
  #   3. a suíte de carga com 10 usuários virtuais por 30 s — o fluxo INTEIRO do usuário (navegação,
  #      revisão FSRS, rodada, loja, sessão, STT/MT contra um provedor FALSO local, upload), com
  #      AUTH_REQUIRED=1 e JWT ES256 de verdade. Reprova fora do SLO de cada classe ou com erro.
  # O runner é compartilhado e ruidoso: o alvo é a regressão de ordem de grandeza, não capacidade.
  # A capacidade (100/1.000 VUs, ponto de quebra) mede-se local: `node scripts/perf/suite/rodar.mjs`.
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Orçamento do bundle (slo.json → frontend)
        run: node scripts/perf/orcamento-bundle.mjs
      - name: Carga leve (autocannon; p95 e rotas do slo.json, zero erro)
        run: node scripts/perf/ci-carga.mjs
      - name: Suíte de carga, 10 usuários virtuais (SLO por classe do slo.json)
        run: node scripts/perf/suite/rodar.mjs --vus=10 --duracao=30 --rampa=5 --pensar=6 --pesados=2 --medios=50 --saida=suite-carga.json
      - name: Artefato da suíte de carga
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-carga
          path: suite-carga.json
          if-no-files-found: ignore

  # E2E NO MODO PÚBLICO (Fase 5 do lançamento). A suíte acima roda sem login; esta sobe o app com
  # AUTH_REQUIRED=1 contra um Supabase Auth FALSO (tests/e2e-publico/_supabase-falso.mjs) — login pelo
  # supabase-js no navegador, token ES256 verificado pelo JWKS, 2FA elevando a sessão para aal2.
  # Sem segredo e sem rede externa.
  e2e-publico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E com AUTH_REQUIRED=1
        run: npx playwright test -c playwright.publico.config.ts
      - name: Artefato do e2e público
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-publico
          path: test-results/
          if-no-files-found: ignore

  # A IMAGEM DE PRODUÇÃO (Fase 5). Constrói o Dockerfile de verdade e sobe o container como o Fly
  # sobe: NODE_ENV=production, AUTH_REQUIRED=1, TRUST_PROXY declarada. Depois confere o que só a
  # imagem pode provar: /api/ready 200, a API fechada sem token, os cabeçalhos de cache e de CSP da
  # SPA, e o desligamento gracioso (docker stop sai com 0).
  imagem:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: docker build
        run: |
          docker build -t babel-play:ci \
            --build-arg VITE_SUPABASE_URL=https://ci-exemplo.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=anon-publica-de-ci \
            --build-arg VITE_PUBLIC_URL=https://ci.exemplo.com.br \
            --build-arg VERSAO="$GITHUB_SHA" .
      - name: Litestream fixado está na imagem
        run: docker run --rm --entrypoint litestream babel-play:ci version
      - name: Fumaça do container
        run: |
          docker run -d --name app -p 3000:3000 \
            -e SECRET_KEY=chave-de-ci-com-mais-de-32-caracteres-xx \
            -e SUPABASE_URL=https://ci-exemplo.supabase.co \
            -e AUTH_REQUIRED=1 -e TRUST_PROXY=false -e NODE_ENV=production \
            babel-play:ci
          for i in $(seq 1 60); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready || true)
            [ "$codigo" = "200" ] && break
            sleep 2
          done
          docker logs app | tail -30
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/sessions)" = "401"
          curl -sI http://127.0.0.1:3000/ | tee cabecalhos.txt
          grep -qi '^cache-control: no-cache' cabecalhos.txt
          grep -qi '^content-security-policy:' cabecalhos.txt
          grep -qi 'rel="canonical" href="https://ci.exemplo.com.br/"' <(curl -s http://127.0.0.1:3000/)
          ativo=$(curl -s http://127.0.0.1:3000/ | grep -o '/assets/index-[^"]*\.js' | head -n 1)
          curl -sI "http://127.0.0.1:3000$ativo" | grep -qi 'cache-control: public, max-age=31536000, immutable'
      - name: Desligamento gracioso (docker stop → saída 0)
        run: |
          docker stop -t 30 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = "0"
      # VARREDURA DA IMAGEM (Fase 6 da prontidão). O `npm audit` do job de cima vê as dependências do
      # package.json; a imagem tem mais: o Debian de base, o Node, o binário do Litestream. Trivy em
      # cima da imagem que acabou de ser construída, reprovando só HIGH/CRITICAL COM correção
      # disponível (`ignore-unfixed`): CVE sem fix não tem ação possível e só ensinaria a ignorar o
      # passo. Severidade abaixo de HIGH não reprova — sai no relatório.
      #
      # FIXADA NO SHA DA 0.35.0, e não é zelo: em 19/03/2026 as tags 0.0.1–0.34.2 do trivy-action
      # foram reescritas para um ladrão de segredos de CI (GHSA-69fq-xp46-6x23); a 0.35.0 é a única
      # limpa. O binário do Trivy também vai fixado (v0.69.4 foi a versão maliciosa; v0.69.3 é a segura
      # indicada no aviso). Atualize os dois só conferindo o aviso de segurança do projeto.
      - name: Trivy — vulnerabilidades da imagem (reprova HIGH/CRITICAL com correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: babel-play:ci
          version: v0.69.3
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Trivy — relatório completo (todas as severidades, não reprova)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: babel-play:ci
          version: v0.69.3
          scanners: vuln
          exit-code: '0'
          format: json
          output: trivy-imagem.json
      # SBOM (CycloneDX) da imagem, pelo Syft — o inventário de tudo que vai para produção, para
      # responder "estamos expostos à CVE X?" sem reconstruir nada. Vai como artefato do CI.
      - name: SBOM da imagem (Syft, CycloneDX)
        if: always()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: babel-play:ci
          format: cyclonedx-json
          output-file: sbom-imagem.cdx.json
          upload-artifact: false
      - name: Artefato da varredura e do SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imagem-trivy-sbom
          path: |
            trivy-imagem.json
            sbom-imagem.cdx.json
          if-no-files-found: ignore

  # RESTAURAÇÃO DO LITESTREAM, DE VERDADE (Fase 5). Um MinIO faz o papel do R2: o container grava,
  # replica e para; um SEGUNDO container, com volume VAZIO, restaura sozinho no boot (entrypoint) e o
  # dado precisa estar lá, com integrity_check ok. Backup que nunca foi restaurado não é backup.
  restauracao-litestream:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: '1'
      AWS_ACCESS_KEY_ID: minio-ci
      AWS_SECRET_ACCESS_KEY: minio-ci-segredo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: docker build
        run: |
          docker build -t babel-play:ci \
            --build-arg VITE_SUPABASE_URL=https://ci-exemplo.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=anon-publica-de-ci .
      - name: MinIO no lugar do R2
        run: |
          docker network create rede
          docker run -d --name minio --network rede -p 9000:9000 \
            -e MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID -e MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://litestream-ci
      - name: Primeiro container grava e replica
        run: |
          comum="-e SECRET_KEY=chave-de-ci-com-mais-de-32-caracteres-xx -e SUPABASE_URL=https://ci-exemplo.supabase.co \
                 -e AUTH_REQUIRED=1 -e TRUST_PROXY=false -e NODE_ENV=production \
                 -e LITESTREAM_BUCKET=litestream-ci -e LITESTREAM_ENDPOINT=http://minio:9000 \
                 -e LITESTREAM_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e LITESTREAM_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
          echo "comum=$comum" >> "$GITHUB_ENV"
          docker run -d --name um --network rede -v dados-um:/data $comum babel-play:ci
          for i in $(seq 1 60); do docker exec um node -e "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 2; done
          docker exec -e MARCA="$GITHUB_SHA" um node -e "
            const { createClient } = require('@libsql/client');
            const c = createClient({ url: 'file:/data/babel.db' });
            (async () => {
              await c.execute('CREATE TABLE IF NOT EXISTS marca_ci (valor TEXT)');
              await c.execute({ sql: 'INSERT INTO marca_ci VALUES (?)', args: [process.env.MARCA] });
              c.close();
            })();"
          sleep 10
          docker stop -t 30 um
          docker logs um | tail -20
          aws --endpoint-url http://127.0.0.1:9000 s3 ls --recursive s3://litestream-ci | head
      - name: Segundo container, volume vazio, restaura sozinho
        run: |
          docker run -d --name dois --network rede -v dados-dois:/data $comum babel-play:ci
          for i in $(seq 1 60); do docker exec dois node -e "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 2; done
          docker logs dois | head -20
          docker exec dois node dist-server/operacao.cjs verificar --arquivo=/data/babel.db
          valor=$(docker exec dois node -e "
            const { createClient } = require('@libsql/client');
            createClient({ url: 'file:/data/babel.db' }).execute('SELECT valor FROM marca_ci').then(r => console.log(r.rows[0].valor));")
          echo "restaurado: $valor"
          test "$valor" = "$GITHUB_SHA"
