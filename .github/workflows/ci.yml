name: CI

on:
  push:
  pull_request:

# UMA EXECUÇÃO POR RAMO (11/10/2026). Dois commits seguidos rodavam a suíte inteira duas vezes, lado a
# lado. Agora o commit novo cancela a execução do anterior no mesmo ramo — menos na `main`, onde toda
# execução termina: é o `ci.yml` verde do SHA que o `deploy.yml` exige. O evento entra no grupo para o
# push e o pull_request do mesmo ramo não se cancelarem um ao outro.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# O `npm ci` do onnxruntime-node baixa do nuget.org, no Linux x64, os binários de CUDA — o runner
# não tem GPU, e o nuget fora do ar derrubava o job antes de qualquer teste (ETIMEDOUT, 30/09/2026).
# Os binários de CPU vêm no próprio pacote do npm.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

# COMO ESTE ARQUIVO ESTÁ DIVIDIDO (11/10/2026). Até aqui o job `verify` era uma fila única de ~46 min
# (portões estáticos → unidade → build → e2e → mais portões): se a unidade caía, o e2e nem rodava; se
# o e2e caía, os portões baratos do fim nem rodavam, e cada execução vermelha mostrava UMA falha.
# Agora cada grupo é um job independente e paralelo, e nenhum portão barato espera um passo caro:
#   estatico            YAML, typecheck ×3, lint, código morto, build, i18n, auditoria, rotas, ast-grep
#   unidade (2 fatias)  vitest com cobertura, `--shard`; `unidade-cobertura` junta e cobra o piso
#   e2e (5 fatias)      um job por viewport; celular e desktop em duas fatias (`--shard`)
#   e2e-estatica (4)    um job por viewport × duas fatias
#   e2e-publico, migracoes, carga, imagem-construir → imagem e restauracao-litestream
#   postgres-real       os testes que só rodam com TESTE_POSTGRES_URL, contra um postgres:17 de serviço
# O `deploy.yml` cobra a CONCLUSÃO da execução inteira (`conclusion == success`), não o nome de um
# job: uma fatia vermelha reprova a execução como o `verify` reprovava.
jobs:
  # O QUE MUDOU DESDE A ÚLTIMA EXECUÇÃO VERDE DESTE RAMO. Serve só para NÃO gastar: mudança só de
  # documentação não roda e2e, Docker nem carga; mudança só de documentação/teste não roda Docker nem
  # carga (a imagem não leva `tests/`, e o `.dockerignore` tira `docs/` e `openspec/`).
  #
  # A base é a última execução VERDE do ramo, e não o commit anterior do push: com o cancelamento
  # acima, um commit de código cuja execução foi cancelada por um commit só de documentação ficaria
  # sem teste nenhum. Assim o diff sempre cobre tudo o que ainda não passou.
  #
  # Na dúvida, roda TUDO: na `main` (sempre), em ramo sem execução verde, se a API falhar, se a base
  # não for ancestral (force-push), se o diff vier vazio. Os portões baratos (estatico, unidade,
  # migracoes) não dependem deste job e rodam sempre.
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      e2e: ${{ steps.filtro.outputs.e2e }}
      pesados: ${{ steps.filtro.outputs.pesados }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classificar a mudança
        id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_PR: ${{ github.base_ref }}
          RAMO: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          tudo() {
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "pesados=true" >> "$GITHUB_OUTPUT"
            echo "Roda tudo: $1." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$GITHUB_REF" = "refs/heads/main" ] && tudo "é a main"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_PR" HEAD 2>/dev/null) || tudo "não achei a base do PR"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$RAMO" -f event=push -f status=success -F per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || tudo "a API do Actions não respondeu"
            [ -n "$base" ] || tudo "este ramo ainda não tem execução verde"
            git merge-base --is-ancestor "$base" HEAD 2>/dev/null \
              || tudo "a última execução verde ($base) não é ancestral deste commit"
          else
            tudo "evento $GITHUB_EVENT_NAME"
          fi
          arquivos=$(git diff --name-only "$base" HEAD) || tudo "o git diff falhou"
          [ -n "$arquivos" ] || tudo "nenhum arquivo mudou desde $base"

          # Só documentação: `docs/**`, `openspec/**` e os `.md` da RAIZ (um `.md` dentro de `src/` ou
          # `public/` vai no pacote). Nada disso é lido pelo app, pelo build nem pelos e2e; os testes
          # de unidade leem `docs/`, e por isso a unidade roda sempre.
          DOCS='^(docs/|openspec/)|^[^/]+\.md$'
          # Não entra na imagem nem na carga: o de cima, os testes e a configuração deles.
          LEVES="$DOCS"'|^tests/|^\.claude/|^playwright[^/]*\.config\.ts$|^vitest\.config\.ts$'
          # O grep sai com 0 se ALGUM arquivo fica fora do padrão e com 1 se TODOS estão dentro. Só o
          # 1 desliga um job; erro do grep (2) ou qualquer outra saída mantém ligado. Sem pipe, de
          # propósito: com `pipefail`, um `echo | grep -q` de diff grande pode sair diferente de 0
          # por SIGPIPE e seria lido como "tudo dentro".
          fora_de() { grep -qvE "$1" <<< "$arquivos"; }
          r=0; fora_de "$DOCS" || r=$?
          if [ "$r" -eq 1 ]; then e2e=false; else e2e=true; fi
          r=0; fora_de "$LEVES" || r=$?
          if [ "$r" -eq 1 ]; then pesados=false; else pesados=true; fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "pesados=$pesados" >> "$GITHUB_OUTPUT"
          {
            echo "Base: \`$base\` (última execução verde deste ramo, ou a base do PR)."
            echo "e2e: **$e2e** · Docker e carga: **$pesados** · arquivos mudados: $(echo "$arquivos" | wc -l)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # OS PORTÕES ESTÁTICOS — tudo o que não precisa de navegador nem da suíte: ~4 min. Cada passo roda
  # MESMO QUE O ANTERIOR TENHA FALHADO (`!cancelled()`): um erro de tipo não esconde o de lint nem o
  # de i18n, e uma execução mostra todos de uma vez. Só o `npm ci` é pré-requisito de todos.
  estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas por SHA (tag é ponteiro mutável); a versão legível fica no comentário,
      # que é o que o Dependabot atualiza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - id: deps
        run: npm ci
        timeout-minutes: 5
      # Primeiro de tudo: um workflow com YAML invalido nao falha, apenas nao roda. O uptime.yml
      # ficou assim de 31/08 a 07/09 sem ninguem ver (auditoria de 2026-09-07, achado A42).
      - name: YAML dos workflows
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run workflows:validar
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck
        timeout-minutes: 5
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck:core
        timeout-minutes: 5
      # `strict` LIGADO na arvore inteira. O `tsconfig.json` da raiz nunca teve `strict`, e a Fase 3
      # zerou os 81 erros que ele acusava (30 vinham de uma assinatura so, em `lazyComRecarga`).
      # Este passo impede que o proximo entre: nao ha lista de pendentes porque nao sobrou nenhum.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck:estrito
        timeout-minutes: 5
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint
        timeout-minutes: 5
      # CODIGO MORTO (auditoria de 2026-09-07, achados A50-A56): 15 arquivos sem importador,
      # dependencias sem uso e dois ciclos de importacao entraram porque nada os cobrava. Os dois
      # passos abaixo cobram, no dia em que o proximo entrar.
      #
      # A cobranca e sobre ARQUIVO, DEPENDENCIA e CICLO — nao sobre export sem uso. Um export sem
      # chamador e ruido de barril (`index.ts` reexporta o que cada tela importa da origem) e
      # produziria falha por algo que nao e defeito; arquivo orfao, dependencia que ninguem instala
      # por um motivo e ciclo de importacao nao tem leitura ambigua.
      - name: Sem arquivo, dependencia ou import nao declarado sobrando
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run morto:arquivos
        timeout-minutes: 5
      - name: Sem ciclo de importacao
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run morto:ciclos
        timeout-minutes: 5
      # O build de produção como portão (o `carga` e a imagem também buildam, mas só rodam quando o
      # código muda; este roda sempre).
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build
        timeout-minutes: 10
      # O catalogo pseudo tem que estar em dia, senao o teste de layout roda sobre um mapa velho
      # e deixa de ver as strings novas — falha silenciosa, do tipo que este repo ja documenta.
      - name: Catalogo pseudo em dia
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/i18n/pseudo.mjs --check

      # Chave de catalogo que sumiu do codigo. A chave de traducao E o texto portugues, entao
      # reescrever uma frase orfana a traducao dela em TODOS os idiomas — e o fallback e legivel,
      # ou seja, ninguem percebe olhando a tela. So um gate percebe.
      - name: Chaves de traducao orfas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run i18n:orfas

      # A lista de idiomas que a interface OFERECE sai da cobertura medida de cada catalogo
      # (`src/data/i18n/cobertura.json`, versionado). Desatualizado, o seletor volta a oferecer um
      # idioma com 3% traduzido — que foi o achado A38 da auditoria de 2026-09-07.
      - name: Cobertura dos catalogos em dia
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/i18n/cobertura.mjs --check

      # A catraca: cobertura de i18n nao se perde por decisao, se perde por descuido, e o fallback
      # legivel esconde a perda. O piso so sobe; abaixa-lo exige justificativa no mesmo commit.
      #
      # 427 -> 420 em 07/09: os nove jogos culturais sairam da grade (change
      # `jogos-culturais-dentro-do-sistema`) e levaram junto 7 chamadas de `t()` — os rotulos dos
      # cards, a aba "Jogos do Mundo" e o selo "100% Funcional". Remocao deliberada de tela, nao
      # perda de cobertura: as chaves nem estavam traduzidas em `en.json`.
      #
      # 420 -> 415 em 12/09 (redesign v4). Cinco elementos sairam da tela Inicio, nao cinco
      # traducoes: o rotulo "Seu estudo" e a frase de apoio do cabecalho, que no perfil
      # Produtividade o design nao tem; o subtitulo "Retencao, tempo de estudo e evolucao
      # semanal" do cartao de estatisticas, que virou link; e os rotulos "Expandir"/"Ocultar"
      # daquele mesmo controle, cujo estado agora vem de `aria-expanded` em vez de texto.
      # As frases REESCRITAS (titulo do Inicio, os tres pilares) nao contam aqui: elas
      # continuam passando por `t()` e ganharam chave nova em `en.json` no mesmo commit.
      - name: Piso de cobertura da interface
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/i18n/orfas.mjs --progresso --piso=415

      # Falha em HIGH/CRITICAL, exceto a allowlist NOMEADA das sem fix upstream.
      - name: Auditoria de dependências
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run audit:gate
        timeout-minutes: 5

      # Invariantes arquiteturais deste repositório (não SAST genérico): as regras têm fixture,
      # porque uma regra errada devolve zero achados e isso tem a cara de "código limpo".
      # Toda rota do servidor tem teste de caracterizacao ou motivo escrito (Fase 1).
      - name: Rotas sem caracterizacao
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/testes/rotas-sem-caracterizacao.mjs
      # E toda rota tem quem a chame — a pergunta do outro lado (Fase 2). `rotas-espelhadas`
      # cobra que a rota que o cliente chama exista sem conta; esta cobra que a rota que o
      # servidor registra tenha consumidor, que foi como `POST /api/ai/llm/chat/completions`
      # ficou orfa sem nada acusar (achado A52 de 2026-09-07).
      - name: Rotas sem consumidor
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/testes/rotas-sem-consumidor.mjs
      # E nenhuma rota /api some sem passar pela depreciação (Fase 6 da prontidão): a aba aberta
      # com o bundle anterior, e o servidor anterior num rollback, dependem dela. Mesmo censo do
      # passo de cima (`scripts/testes/_rotas-do-servidor.mjs`); política em docs/versionamento.md.
      - name: Contrato da API (remoção só após depreciação)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run contrato:api
      - name: Regras arquiteturais (ast-grep)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          ./node_modules/.bin/ast-grep test -c sgconfig.yml
          ./node_modules/.bin/ast-grep scan -c sgconfig.yml src server server.ts
      # AS FATIAS DO E2E COBREM TODOS OS PROJETOS. Os jobs `e2e` e `e2e-estatica` listam os projetos
      # (viewports) na matriz; um projeto novo no playwright.config.ts que não entre na matriz
      # deixaria de rodar sem ninguém ver. Aqui o total de testes da configuração tem de ser igual ao
      # dos projetos das matrizes (`--list` não abre navegador). Projeto novo: ponha nas duas listas.
      - name: Fatias do e2e cobrem todos os projetos
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          total() { npx playwright test "$@" --list | sed -n 's/^Total: \([0-9]*\) tests.*/\1/p'; }
          t=$(total); f=$(total --project=mobile-375 --project=tablet-768 --project=desktop-1280)
          echo "e2e principal: $t testes na configuração, $f nos projetos das fatias"
          test -n "$t" && test "$t" = "$f"
          t=$(total -c playwright.estatica.config.ts)
          f=$(total -c playwright.estatica.config.ts --project=desktop-1280 --project=mobile-375)
          echo "e2e estática: $t testes na configuração, $f nos projetos das fatias"
          test -n "$t" && test "$t" = "$f"

  # UNIDADE E INTEGRAÇÃO, EM DUAS FATIAS (`vitest --shard`). A suíte inteira levava ~9 min num job
  # só (874 arquivos; um deles, `integration/anki-bomba`, leva 3 min sozinho). Cada fatia roda com a
  # cobertura v8 ligada e grava o relatório `blob` (resultados + cobertura crua); o piso NÃO é
  # cobrado aqui (zerado na linha de comando), porque meia suíte nunca o alcançaria — quem cobra é
  # o `unidade-cobertura`, sobre o total juntado.
  # Mudar o número de fatias: a lista `fatia` daqui e o `FATIAS` do job de baixo.
  unidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2]
    name: unidade (${{ matrix.fatia }}/${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Testes de unidade e integracao (fatia, com cobertura)
        timeout-minutes: 15
        run: >
          npx vitest run --shard=${{ matrix.fatia }}/${{ strategy.job-total }} --coverage
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob
          --outputFile.blob=vitest-fatias/fatia-${{ matrix.fatia }}.json
      # `!cancelled()`: a fatia com teste vermelho também sobe o blob — o job de baixo junta o que
      # caiu no JSON da suíte.
      - name: Artefato da fatia (blob do vitest)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-fatia-${{ matrix.fatia }}
          path: vitest-fatias/
          retention-days: 1
          if-no-files-found: ignore

  # O PISO DE COBERTURA, SOBRE O TOTAL. `vitest --merge-reports` junta os blobs das fatias e gera o
  # relatório de cobertura da suíte inteira; aqui valem os `coverage.thresholds` do vitest.config.ts,
  # sem alteração (conferido localmente: a soma de duas fatias dá os mesmos números da suíte num
  # processo só, e o comando sai com 1 abaixo do piso). Se faltar o blob de uma fatia, este job
  # REPROVA em vez de cobrar o piso sobre meia suíte.
  #
  # O JSON da suite vai como artefato SEMPRE: a run 34278328814 (08/09) falhou em `npm test` e o log
  # do job so e legivel por quem tem admin no repositorio — quem nao tem ficava sem saber QUAL teste
  # caiu. O artefato e publico para quem ve o repositorio.
  # COM COBERTURA e com piso (`coverage.thresholds` no vitest.config.ts): a rede de seguranca
  # da rodada de saneamento (Fase 1) so protege se a cobertura nao puder cair em silencio.
  unidade-cobertura:
    needs: unidade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FATIAS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Blobs das fatias
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-fatia-*
          path: vitest-fatias
          merge-multiple: true
      - name: Todas as fatias chegaram
        run: |
          achadas=$(find vitest-fatias -name 'fatia-*.json' | wc -l)
          echo "fatias: $achadas de $FATIAS"
          test "$achadas" -eq "$FATIAS"
      - name: Suite juntada (com cobertura e piso)
        timeout-minutes: 5
        run: npx vitest run --merge-reports=vitest-fatias --coverage --reporter=default --reporter=json --outputFile.json=vitest-resultado.json
      - name: Artefato da cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
      - name: Artefato da suite (vitest)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-resultado
          path: vitest-resultado.json
          if-no-files-found: ignore

  # O DRIVER `pg` DE VERDADE (revisão final da Fase 1, I4). A suíte das fatias roda no PGlite; os testes
  # que exigem um Postgres de verdade (duas transações ao mesmo tempo, vários processos no mesmo banco,
  # int8 do `pg`, lock_timeout) se pulam sem `TESTE_POSTGRES_URL` — e nenhum job a definia, então o
  # driver de produção nunca rodava no CI. Aqui um `postgres:17` de serviço e SÓ esses arquivos, na
  # lista explícita abaixo; o passo "Lista completa" reprova se surgir arquivo novo com a variável e
  # ele não entrar aqui. A suíte de integração INTEIRA sobre o Postgres de verdade é da Fase 2.
  postgres-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: babel
          POSTGRES_PASSWORD: babel-ci
          POSTGRES_DB: babel_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babel -d babel_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Senha descartável de um contêiner de serviço que só existe neste job; não é segredo.
      TESTE_POSTGRES_URL: postgres://babel:babel-ci@localhost:5432/babel_teste
      ARQUIVOS: >-
        tests/integration/admissao-no-banco.test.ts
        tests/integration/agregados-concorrentes.test.ts
        tests/integration/cluster.test.ts
        tests/integration/db-por-requisicao.test.ts
        tests/integration/desligamento-gracioso.test.ts
        tests/integration/gasto-concorrente.test.ts
        tests/integration/int8-no-pg.test.ts
        tests/integration/jobs-idempotentes.test.ts
        tests/integration/limpeza-analyze.test.ts
        tests/integration/lotes-em-uma-instrucao.test.ts
        tests/integration/medicao-de-transacao-pg.test.ts
        tests/integration/migracoes-sem-prazo.test.ts
        tests/integration/pool-lock-timeout-pg.test.ts
        tests/integration/prazos-do-papel.test.ts
        tests/integration/r2-teto-armazenamento.test.ts
        tests/integration/rodada-e-glossario-concorrentes.test.ts
        tests/integration/teto-de-erros-entre-instancias.test.ts
        tests/integration/travas-de-linha.test.ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Lista completa (todo teste com TESTE_POSTGRES_URL está em ARQUIVOS)
        run: |
          achados=$(grep -rl TESTE_POSTGRES_URL tests --include='*.test.ts' | sort)
          esperados=$(printf '%s\n' $ARQUIVOS | sort)
          diff <(echo "$achados") <(echo "$esperados")
      - run: npm ci
        timeout-minutes: 5
      - name: Testes contra o Postgres de verdade
        timeout-minutes: 10
        run: npx vitest run $ARQUIVOS --maxWorkers=2

  # E2E PRINCIPAL, UM JOB POR VIEWPORT. Os três projetos rodavam em série no `verify` (~33 min:
  # celular 12, tablet 7, desktop 13). Cada fatia sobe o SEU servidor e o SEU banco vazio, então o
  # `workers: 1` do playwright.config.ts continua valendo dentro dela (o motivo dele é o banco
  # único, e aqui cada fatia tem o seu). Celular e desktop passam de 10 min e vão em duas fatias
  # (`--shard`, que divide por ARQUIVO: os `beforeAll` que semeiam o banco ficam inteiros).
  #
  # O e2e existia e nenhum workflow o chamava. E agora ele carrega o teste de layout com
  # pseudo-localizacao, que e o unico que ve texto cortado antes de haver traducao para cortar.
  e2e:
    needs: mudancas
    if: needs.mudancas.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { projeto: mobile-375, fatia: 1, fatias: 2 }
          - { projeto: mobile-375, fatia: 2, fatias: 2 }
          - { projeto: tablet-768, fatia: 1, fatias: 1 }
          - { projeto: desktop-1280, fatia: 1, fatias: 2 }
          - { projeto: desktop-1280, fatia: 2, fatias: 2 }
    name: e2e (${{ matrix.projeto }} ${{ matrix.fatia }}/${{ matrix.fatias }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # CACHE DOS NAVEGADORES pela versão EXATA do Playwright instalada (cada versão fixa a sua
      # build do Chromium). O passo de instalação roda sempre: com o cache, ele acha o navegador e
      # só instala as dependências do sistema; sem o cache (ou com ele incompleto), baixa como antes.
      - name: Versão do Playwright (chave do cache)
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}-chromium
      # `npm ci` nao baixa o navegador do Playwright; sem esta linha o passo abaixo falha com
      # "browser not found" em toda maquina limpa — o gate parecia existir e nunca podia passar.
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      # `github` além do `list`: as falhas de todas as fatias aparecem juntas, como anotações, na
      # página da execução.
      - name: Testes de ponta a ponta
        timeout-minutes: 20
        run: npx playwright test --project=${{ matrix.projeto }} --shard=${{ matrix.fatia }}/${{ matrix.fatias }} --reporter=list,github
      # Trace e screenshot de falha ja eram configurados no playwright.config.ts e nunca saiam do
      # runner: a configuracao existia, a evidencia nao.
      - name: Artefato do e2e (trace, screenshot)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-resultado-${{ matrix.projeto }}-${{ matrix.fatia }}de${{ matrix.fatias }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # MIGRATIONS EXPAND/CONTRACT (Fase 6 da prontidão). As migrations rodam no boot, só para a frente,
  # e o rollback troca a IMAGEM sem voltar o banco: migration nova só ACRESCENTA, salvo marcador
  # `-- CONTRATO:` numa migration que venha sozinha (sem código de servidor/cliente no mesmo diff).
  # Job próprio porque precisa do histórico (`fetch-depth: 0`) para o `git diff` contra a base, e
  # não precisa de `npm ci` (o script só usa módulos do Node). Regras em docs/versionamento.md §3.
  migracoes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # PR: compara com a branch de destino. Push: com o commit anterior do push (vazio/zeros numa
      # branch nova — aí o script cobra só o marcador e avisa).
      - name: Portão expand/contract
        env:
          BASE_PR: ${{ github.base_ref }}
          ANTES_DO_PUSH: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_PR" ]; then base="origin/$BASE_PR"; else base="$ANTES_DO_PUSH"; fi
          node scripts/migracoes/conferir.mjs --base="$base"

  # CARGA LEVE E ORÇAMENTO DO BUNDLE (Fases 6 e 4 da prontidão). Todos os limiares vêm de UM
  # arquivo, `scripts/perf/suite/slo.json` (a fonte de `docs/slo.md`): mudar um teto é mudar o JSON
  # e o documento, no mesmo commit, com a justificativa.
  #   1. orçamento do bundle: JS e CSS iniciais em gzip abaixo do teto (o medido + 10%) e nenhum
  #      arquivo só de desenvolvimento (protótipo de design, lucide.min.js) no `dist`;
  #   2. autocannon nas rotas baratas (servidor BUILDADO, banco vazio, self-host: mede a rota, não a
  #      borda), p95 abaixo do SLO de leitura e zero erro/não-2xx;
  #   3. a suíte de carga com 10 usuários virtuais por 30 s — o fluxo INTEIRO do usuário (navegação,
  #      revisão FSRS, rodada, loja, sessão, STT/MT contra um provedor FALSO local, upload), com
  #      AUTH_REQUIRED=1 e JWT ES256 de verdade. Reprova fora do SLO de cada classe ou com erro.
  # O runner é compartilhado e ruidoso: o alvo é a regressão de ordem de grandeza, não capacidade.
  # A capacidade (100/1.000 VUs, ponto de quebra) mede-se local: `node scripts/perf/suite/rodar.mjs`.
  # Roda sempre na `main`; num ramo, só quando muda algo que entra no build ou no servidor (`mudancas`).
  carga:
    needs: mudancas
    if: needs.mudancas.outputs.pesados == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 10
      - name: Orçamento do bundle (slo.json → frontend)
        run: node scripts/perf/orcamento-bundle.mjs
      - name: Carga leve (autocannon; p95 e rotas do slo.json, zero erro)
        run: node scripts/perf/ci-carga.mjs
        timeout-minutes: 5
      - name: Suíte de carga, 10 usuários virtuais (SLO por classe do slo.json)
        run: node scripts/perf/suite/rodar.mjs --vus=10 --duracao=30 --rampa=5 --pensar=6 --pesados=2 --medios=50 --saida=suite-carga.json
        timeout-minutes: 5
      - name: Artefato da suíte de carga
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-carga
          path: suite-carga.json
          if-no-files-found: ignore

  # E2E NO MODO PÚBLICO (Fase 5 do lançamento). A suíte acima roda sem login; esta sobe o app com
  # AUTH_REQUIRED=1 contra um Supabase Auth FALSO (tests/e2e-publico/_supabase-falso.mjs) — login pelo
  # supabase-js no navegador, token ES256 verificado pelo JWKS, 2FA elevando a sessão para aal2.
  # Sem segredo e sem rede externa.
  e2e-publico:
    needs: mudancas
    if: needs.mudancas.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # O mesmo cache do job `e2e` (a explicação está lá).
      - name: Versão do Playwright (chave do cache)
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}-chromium
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: E2E com AUTH_REQUIRED=1
        run: npx playwright test -c playwright.publico.config.ts
        timeout-minutes: 10
      - name: Artefato do e2e público
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-publico
          path: test-results/
          if-no-files-found: ignore

  # E2E DA EDIÇÃO ESTÁTICA — o `dist/` de `npm run build:estatica`, servido como o Cloudflare Pages
  # serve (tests/e2e-estatica/_servidor-estatico.mjs: arquivos, fallback de SPA, os cabeçalhos de
  # `_headers`, nenhum servidor Node). É o que vai para produção em babel-play.pages.dev, e a suíte
  # não rodava em workflow nenhum: apodreceu sem ninguém ver (perfis de dispositivo falhando nos três
  # aparelhos desde a captura mobile-first de 29/09). Os dois projetos, desktop-1280 e mobile-375.
  #
  # QUATRO FATIAS: um job por projeto, cada um em duas (`--shard`). Os dois projetos em série
  # levavam ~20 min, e 6,5 min de cada um são de UM arquivo (`jogos.e2e.ts`): dividir por arquivo
  # não equilibrava nada. `--fully-parallel` faz o `--shard` dividir por TESTE; com `--workers=1`
  # os testes continuam um de cada vez, na ordem do arquivo, dentro da fatia. Vale aqui porque esta
  # suíte não tem `beforeAll` nem modo serial, e o servidor é só de arquivos (nenhum estado entre
  # testes). Se um dia tiver, tire o `--fully-parallel` e a divisão volta a ser por arquivo.
  e2e-estatica:
    needs: mudancas
    if: needs.mudancas.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # A suíte inteira leva ~13 min numa máquina de 16 threads; o Quest roda com a CPU 4× mais lenta
    # (CDP). A fatia mais longa fica perto de 6 min de teste.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        projeto: [desktop-1280, mobile-375]
        fatia: [1, 2]
    name: e2e-estatica (${{ matrix.projeto }} ${{ matrix.fatia }}/2)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # O mesmo cache do job `e2e` (a explicação está lá).
      - name: Versão do Playwright (chave do cache)
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}-chromium
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      # O build baixa os modelos do Bergamot pt→en (~26 MB, `scripts/baixar-modelos-bergamot.mjs`) do
      # bucket da Mozilla e confere o sha256 de cada um. Os testes não dependem dele para passar (sem
      # rede, o build sai sem oferecê-lo e os totais são conferidos entre si, não fixados), mas o `dist`
      # testado tem que ser o do Pages, que o oferece: a lista de modelos e o aviso de download contam
      # com ele. Com o cache, o bucket só é tocado quando a fonte dos hashes muda;
      # a chave é essa fonte (`modelosDoBergamot.json`, a mesma que o script e o app leem), então um
      # cache velho nunca serve um modelo que não confere — no pior caso, o script baixa de novo.
      - name: Cache dos modelos do Bergamot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/modelos/bergamot
          key: bergamot-${{ hashFiles('src/gateway/adapters/modelosDoBergamot.json') }}
      - name: Build da edição estática
        run: npm run build:estatica
        timeout-minutes: 10
      - name: E2E da edição estática
        timeout-minutes: 15
        run: npx playwright test -c playwright.estatica.config.ts --project=${{ matrix.projeto }} --fully-parallel --workers=1 --shard=${{ matrix.fatia }}/2 --reporter=list,github
      # Trace e screenshot de falha (`retain-on-failure` na config) e as fotos das telas.
      - name: Artefato do e2e estático (trace, screenshot)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-estatica-${{ matrix.projeto }}-${{ matrix.fatia }}de2
          path: test-results/
          if-no-files-found: ignore

  # A IMAGEM, CONSTRUÍDA UMA VEZ. Os jobs `imagem` e `restauracao-litestream` faziam cada um o seu
  # `docker build` (~2,3 min cada) da mesma imagem; agora este job constrói, e os dois recebem o
  # arquivo da imagem como artefato (`docker load`) — a que a varredura examina é a mesma que restaura.
  #
  # CACHE DE CAMADAS (buildx, `type=gha`, `mode=max` para guardar também os estágios `build` e
  # `litestream`, que não vão na imagem final): num ramo, as camadas caras que não mudaram — os dois
  # `npm ci` (chave: o `package-lock.json`), a compilação do Litestream (chave: os ARG fixados), o
  # `apt-get upgrade` — vêm do cache, e só o que depende do código é refeito.
  # NA `main` O CACHE NÃO É LIDO (`no-cache`): a construção é do zero, como era. Camada em cache não
  # refaz o `apt-get upgrade` nem a conferência do commit do Litestream, e é da `main` que sai a
  # produção — lá nada pode ser dado por conferido. A `main` ainda GRAVA o cache, que os ramos leem.
  #
  # Roda sempre na `main`; num ramo, só quando muda algo que entra na imagem (`mudancas`).
  imagem-construir:
    needs: mudancas
    if: needs.mudancas.outputs.pesados == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sem o artefato extra de "registro de build" que a action sobe por padrão.
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: babel-play:ci
          build-args: |
            VITE_SUPABASE_URL=https://ci-exemplo.supabase.co
            VITE_SUPABASE_ANON_KEY=anon-publica-de-ci
            VITE_PUBLIC_URL=https://ci.exemplo.com.br
            VERSAO=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/babel-play-ci.tar
          cache-from: type=gha,scope=imagem
          cache-to: type=gha,scope=imagem,mode=max
          no-cache: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
      - name: Artefato da imagem (para os dois jobs de baixo)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagem-docker
          path: ${{ runner.temp }}/babel-play-ci.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  # A IMAGEM DE PRODUÇÃO (Fase 5). Constrói o Dockerfile de verdade e sobe o container como o Fly
  # sobe: NODE_ENV=production, AUTH_REQUIRED=1, TRUST_PROXY declarada. Depois confere o que só a
  # imagem pode provar: /api/ready 200, a API fechada sem token, os cabeçalhos de cache e de CSP da
  # SPA, e o desligamento gracioso (docker stop sai com 0).
  imagem:
    needs: imagem-construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Imagem construída no job de cima
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: imagem-docker
          path: ${{ runner.temp }}
      - name: docker load
        run: docker load --input "$RUNNER_TEMP/babel-play-ci.tar"
      - name: Litestream fixado está na imagem
        run: docker run --rm --entrypoint litestream babel-play:ci version
      - name: Fumaça do container
        timeout-minutes: 5
        run: |
          docker run -d --name app -p 3000:3000 \
            -e SECRET_KEY=chave-de-ci-com-mais-de-32-caracteres-xx \
            -e SUPABASE_URL=https://ci-exemplo.supabase.co \
            -e AUTH_REQUIRED=1 -e TRUST_PROXY=false -e NODE_ENV=production \
            babel-play:ci
          for i in $(seq 1 60); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready || true)
            [ "$codigo" = "200" ] && break
            sleep 2
          done
          docker logs app | tail -30
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/sessions)" = "401"
          curl -sI http://127.0.0.1:3000/ | tee cabecalhos.txt
          grep -qi '^cache-control: no-cache' cabecalhos.txt
          grep -qi '^content-security-policy:' cabecalhos.txt
          grep -qi 'rel="canonical" href="https://ci.exemplo.com.br/"' <(curl -s http://127.0.0.1:3000/)
          ativo=$(curl -s http://127.0.0.1:3000/ | grep -o '/assets/index-[^"]*\.js' | head -n 1)
          curl -sI "http://127.0.0.1:3000$ativo" | grep -qi 'cache-control: public, max-age=31536000, immutable'
      - name: Desligamento gracioso (docker stop → saída 0)
        run: |
          docker stop -t 30 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = "0"
      # VARREDURA DA IMAGEM (Fase 6 da prontidão). O `npm audit` do job de cima vê as dependências do
      # package.json; a imagem tem mais: o Debian de base, o Node, o binário do Litestream. Trivy em
      # cima da imagem que acabou de ser construída, reprovando só HIGH/CRITICAL COM correção
      # disponível (`ignore-unfixed`): CVE sem fix não tem ação possível e só ensinaria a ignorar o
      # passo. Severidade abaixo de HIGH não reprova — sai no relatório.
      #
      # FIXADA NO SHA DA 0.35.0, e não é zelo: em 19/03/2026 as tags 0.0.1–0.34.2 do trivy-action
      # foram reescritas para um ladrão de segredos de CI (GHSA-69fq-xp46-6x23); a 0.35.0 é a única
      # limpa. O binário do Trivy também vai fixado (v0.69.4 foi a versão maliciosa; v0.69.3 é a segura
      # indicada no aviso). Atualize os dois só conferindo o aviso de segurança do projeto.
      - name: Trivy — vulnerabilidades da imagem (reprova HIGH/CRITICAL com correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: babel-play:ci
          version: v0.69.3
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Trivy — relatório completo (todas as severidades, não reprova)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: babel-play:ci
          version: v0.69.3
          scanners: vuln
          exit-code: '0'
          format: json
          output: trivy-imagem.json
      # SBOM (CycloneDX) da imagem, pelo Syft — o inventário de tudo que vai para produção, para
      # responder "estamos expostos à CVE X?" sem reconstruir nada. Vai como artefato do CI.
      - name: SBOM da imagem (Syft, CycloneDX)
        if: always()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: babel-play:ci
          format: cyclonedx-json
          output-file: sbom-imagem.cdx.json
          upload-artifact: false
      - name: Artefato da varredura e do SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagem-trivy-sbom
          path: |
            trivy-imagem.json
            sbom-imagem.cdx.json
          if-no-files-found: ignore

  # RESTAURAÇÃO DO LITESTREAM, DE VERDADE (Fase 5). Um MinIO faz o papel do R2: o container grava,
  # replica e para; um SEGUNDO container, com volume VAZIO, restaura sozinho no boot (entrypoint) e o
  # dado precisa estar lá, com integrity_check ok. Backup que nunca foi restaurado não é backup.
  # A imagem é a do `imagem-construir` (antes este job construía a sua, sem VITE_PUBLIC_URL e sem
  # VERSAO — argumentos que a restauração não usa).
  restauracao-litestream:
    needs: imagem-construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: minio-ci
      AWS_SECRET_ACCESS_KEY: minio-ci-segredo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Imagem construída no job de cima
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: imagem-docker
          path: ${{ runner.temp }}
      - name: docker load
        run: docker load --input "$RUNNER_TEMP/babel-play-ci.tar"
      # A imagem `minio/minio` saiu do Docker Hub (o pull passou a responder "repository does not
      # exist", 30/09/2026). A `bitnamilegacy/minio` é o mesmo servidor MinIO, congelada — para um
      # dublê de R2 no CI isso basta —, FIXADA pelo digest: se sumir ou mudar, o pull falha em vez de
      # rodar outra coisa. A Bitnami sobe com o próprio entrypoint (sem `server /data`), lê as
      # mesmas MINIO_ROOT_* e demora mais no primeiro boot: daí 60 s de espera, não 30.
      - name: MinIO no lugar do R2
        timeout-minutes: 5
        run: |
          docker network create rede
          docker run -d --name minio --network rede -p 9000:9000 \
            -e MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID -e MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY \
            bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/live || { docker logs minio | tail -30; exit 1; }
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://litestream-ci
      - name: Primeiro container grava e replica
        timeout-minutes: 5
        run: |
          comum="-e SECRET_KEY=chave-de-ci-com-mais-de-32-caracteres-xx -e SUPABASE_URL=https://ci-exemplo.supabase.co \
                 -e AUTH_REQUIRED=1 -e TRUST_PROXY=false -e NODE_ENV=production \
                 -e LITESTREAM_BUCKET=litestream-ci -e LITESTREAM_ENDPOINT=http://minio:9000 \
                 -e LITESTREAM_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e LITESTREAM_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
          echo "comum=$comum" >> "$GITHUB_ENV"
          docker run -d --name um --network rede -v dados-um:/data $comum babel-play:ci
          for i in $(seq 1 60); do docker exec um node -e "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 2; done
          docker exec -e MARCA="$GITHUB_SHA" um node -e "
            const { createClient } = require('@libsql/client');
            const c = createClient({ url: 'file:/data/babel.db' });
            (async () => {
              await c.execute('CREATE TABLE IF NOT EXISTS marca_ci (valor TEXT)');
              await c.execute({ sql: 'INSERT INTO marca_ci VALUES (?)', args: [process.env.MARCA] });
              c.close();
            })();"
          sleep 10
          docker stop -t 30 um
          docker logs um | tail -20
          aws --endpoint-url http://127.0.0.1:9000 s3 ls --recursive s3://litestream-ci | head
      - name: Segundo container, volume vazio, restaura sozinho
        timeout-minutes: 5
        run: |
          docker run -d --name dois --network rede -v dados-dois:/data $comum babel-play:ci
          for i in $(seq 1 60); do docker exec dois node -e "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 2; done
          docker logs dois | head -20
          docker exec dois node dist-server/operacao.cjs verificar --arquivo=/data/babel.db
          valor=$(docker exec dois node -e "
            const { createClient } = require('@libsql/client');
            createClient({ url: 'file:/data/babel.db' }).execute('SELECT valor FROM marca_ci').then(r => console.log(r.rows[0].valor));")
          echo "restaurado: $valor"
          test "$valor" = "$GITHUB_SHA"
